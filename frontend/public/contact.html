<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="page-shell">
        <section class="content-card contact-layout">
            <div class="contact-info">
                <span class="badge">Contact</span>
                <h1>Let’s talk</h1>
                <p>Need help with your project or have a question? We are here for you.</p>

                <ul>
                    <li>Email: hello@myapp.com</li>
                    <li>Phone: +39 02 1234 5678</li>
                    <li>Address: Via Roma 12, Milan</li>
                </ul>
            </div>

            <form id="contact-form" class="contact-form">
                <label>
                    Name
                    <input id="contact-name" type="text" name="name" placeholder="Your name" required>
                </label>
                <label>
                    Email
                    <input id="contact-email" type="email" name="email" placeholder="Your email" required>
                </label>
                <label>
                    Message
                    <textarea id="contact-message" name="message" rows="5" placeholder="Write your message..." required></textarea>
                </label>
                <button type="submit">Send message</button>
            </form>
            <div id="contact-result" aria-live="polite"></div>
        </section>
    </main>

    <div id="footer"></div>

    <script src="js/common.js"></script>
    <script src="js/contact.js"></script>
</body>

</html>
