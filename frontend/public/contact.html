<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="/api/v1/css/contact.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <div id="navbar">
        <script>
            fetch('/api/v1/components/navbar.html')
                .then(response => response.text())
                .then(html => document.getElementById('navbar').innerHTML = html);
        </script>
    </div>

    <main class="contact-wrapper">
        <div class="contact-box">
            <h2>Contact</h2>
            <p>Have questions or suggestions? Here is how you can reach us.</p>

            <ul class="contact-list">
                <li>
                    <strong>Email</strong>
                    <span>info@myapp.example</span>
                </li>
                <li>
                    <strong>Phone</strong>
                    <span>+39 123 456 7890</span>
                </li>
                <li>
                    <strong>Address</strong>
                    <span>Via Roma 1, 00100 Rome, Italy</span>
                </li>
            </ul>
        </div>
    </main>

    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
