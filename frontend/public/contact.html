<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <div id="navbar"></div>
    <script>
        fetch('/api/v1/components/navbar.html')
            .then(response => response.text())
            .then(html => document.getElementById('navbar').innerHTML = html);
    </script>

    <main class="page-shell">
        <section class="content-card contact-card">
            <span class="eyebrow">Contatti</span>
            <h1>Parliamone.</h1>
            <p>Hai bisogno di aiuto o vuoi proporre un miglioramento?</p>

            <div class="contact-list">
                <div class="contact-item">
                    <strong>Email</strong>
                    <span>hello@skyflow.app</span>
                </div>
                <div class="contact-item">
                    <strong>Telefono</strong>
                    <span>+39 333 123 4567</span>
                </div>
                <div class="contact-item">
                    <strong>Location</strong>
                    <span>Roma, Italia</span>
                </div>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script>
        fetch('/api/v1/components/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
