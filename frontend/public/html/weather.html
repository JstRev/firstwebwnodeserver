<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <link rel="stylesheet" href="/api/v1/css/weather.css">
    <script src="/api/v1/js/navbar.js" defer></script>
    <script src="/api/v1/js/footer.js" defer></script>
</head>

<body>

    <div id="navbar"></div>

    <div class="weather-wrapper">
        <div class="weather-box">
            <h2>Weather API</h2>
            <p class="subtitle">Enter a city name to check the current weather conditions.</p>

            <form id="weather-form">
                <input type="text" id="city-input" name="city" placeholder="City name" required>
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="weather-box" id="weather-result"></div>
    </div>

    <div id="footer"></div>

    <script src="/api/v1/js/weather.js"></script>
</body>

</html>
