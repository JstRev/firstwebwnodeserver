<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyFlow</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>
    <div id="navbar"></div>
    <script>
        fetch('/api/v1/components/navbar.html')
            .then(response => response.text())
            .then(html => document.getElementById('navbar').innerHTML = html);
    </script>

    <main class="page-shell">
        <section class="hero">
            <div class="hero-copy">
                <span class="eyebrow">Benvenuto</span>
                <h1>Un’esperienza semplice, moderna e leggera.</h1>
                <p>Accedi, scopri il meteo e naviga tra le pagine senza fronzoli.</p>
                <div class="hero-actions">
                    <a class="btn primary" href="/api/v1/weather">Apri il meteo</a>
                    <a class="btn secondary" href="/api/v1/wanted">Scheda FBI</a>
                    <a class="btn secondary" href="/api/v1/login">Accedi</a>
                </div>
            </div>

            <div class="hero-card">
                <h2>Panoramica</h2>
                <ul>
                    <li>Accesso rapido</li>
                    <li>Pagina meteo</li>
                    <li>Scheda FBI Wanted</li>
                    <li>Design pulito</li>
                    <li>Responsive</li>
                </ul>
            </div>
        </section>
    </main>

    <div id="footer"></div>
    <script>
        fetch('/api/v1/components/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
