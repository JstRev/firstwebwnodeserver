<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
</head>

<body>
    <div id="navbar"></div>

    <main class="page-shell">
        <section class="hero-card">
            <span class="badge">Welcome</span>
            <h1>Welcome to My App</h1>
            <p>This is the home page of your application, built with a simple and clean layout.</p>
            <div class="hero-actions">
                <a href="/signup" class="primary-btn">Create account</a>
                <a href="/login" class="secondary-btn">Login</a>
            </div>
        </section>
    </main>

    <div id="footer"></div>

    <script>
        const navbar = document.getElementById('navbar');
        fetch('components/navbar.html')
            .then(response => response.text())
            .then(html => {
                navbar.innerHTML = html;
                const currentPath = window.location.pathname;
                document.querySelectorAll('.nav-links a').forEach(link => {
                    const target = link.getAttribute('href');
                    if ((target === '/' && currentPath === '/') || target === currentPath) {
                        link.classList.add('active');
                    }
                });
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    </script>
</body>
</html>
