<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="/api/v1/css/index.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <!-- Contenitore Navbar: popolato dinamicamente con il componente condiviso navbar.html -->
    <div id="navbar">
        <script>
            fetch('/api/v1/components/navbar.html')
                .then(response => response.text())
                .then(html => document.getElementById('navbar').innerHTML = html);
        </script>
    </div>

    <!-- Contenitore principale della Home page -->
    <div class="container">
        <h1>Welcome to My App</h1>
        <p>This is the home page of your application.</p>
    </div>

    <!-- Contenitore Footer: popolato dinamicamente con il componente condiviso footer.html -->
    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
