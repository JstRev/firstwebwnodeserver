<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/api/v1/css/signup.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <script src="/api/v1/js/navbar.js" defer></script>
    <script src="/api/v1/js/footer.js" defer></script>
</head>

<body>

    <div id="navbar"></div>

    <div class="signup-wrapper">
        <div class="signup-box">
            <h2>Sign Up</h2>
            <form action="/api/v1/signup" method="POST">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Create account</button>
            </form>
        </div>
    </div>

    <div id="footer"></div>

</body>

</html>
