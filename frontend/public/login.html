<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/api/v1/css/login.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <div id="navbar">
        <script>
            fetch('/api/v1/components/navbar.html')
                .then(response => response.text())
                .then(html => document.getElementById('navbar').innerHTML = html);
        </script>
    </div>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>Login</h2>
            <a href="/api/v1/auth/google" class="btn-google">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo">
                Continue with Google
            </a>
        </div>
    </div>

    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
