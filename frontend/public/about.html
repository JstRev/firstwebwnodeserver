<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="/api/v1/css/about.css">
    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
</head>

<body>

    <div id="navbar">
        <script>
            fetch('/api/v1/components/navbar.html')
                .then(response => response.text())
                .then(html => document.getElementById('navbar').innerHTML = html);
        </script>
    </div>

    <main class="about-wrapper">
        <div class="about-box">
            <h2>About My App</h2>
            <p>My App is a modern web application built to showcase clean interfaces, responsive layouts, and smooth user experiences using HTML, CSS, and JavaScript.</p>

            <h3>What we offer</h3>
            <ul class="feature-list">
                <li>Clean and responsive interface</li>
                <li>Simple page navigation</li>
                <li>Login and sign-up flow</li>
                <li>Weather API integration</li>
            </ul>
        </div>
    </main>

    <div id="footer">
        <script>
            fetch('/api/v1/components/footer.html')
                .then(response => response.text())
                .then(html => document.getElementById('footer').innerHTML = html);
        </script>
    </div>

</body>

</html>
