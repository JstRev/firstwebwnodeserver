<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBI Daily Brief</title>

    <link rel="stylesheet" href="/api/v1/css/navbar.css">
    <link rel="stylesheet" href="/api/v1/css/footer.css">
    <link rel="stylesheet" href="/api/v1/css/weather.css">
    <link rel="stylesheet" href="/api/v1/css/fbi.css">
</head>

<body>
    <div id="navbar"></div>
    <script>
        fetch("/api/v1/components/navbar.html")
            .then(response => response.text())
            .then(html => document.getElementById("navbar").innerHTML = html);
    </script>

    <main class="weather-wrapper fbi-wrapper">
        <section class="weather-box fbi-box">
            <h1>FBI Daily Brief</h1>
            <p class="subtitle">A wanted person or a public alert from the FBI most wanted list.</p>
            <div id="fbi-result" aria-live="polite">Loading...</div>
        </section>
    </main>

    <div id="footer"></div>
    <script>
        fetch("/api/v1/components/footer.html")
            .then(response => response.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script>
    <script src="/api/v1/js/FBI.js"></script>
</body>
</html>
